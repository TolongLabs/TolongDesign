name: Private release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: private-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish private CLI
    if: github.repository == 'TolongLabs/TolongDesign' && github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Verify private repository and matching version
        run: |
          test "$(gh repo view --json isPrivate --jq .isPrivate)" = true
          version=$(bun -e 'const p=require("./package.json"); if(p.private!==true) process.exit(1); process.stdout.write(p.version)')
          test "$RELEASE_TAG" = "v${version}"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run all tests
        run: bun test
      - name: Validate documentation
        run: bun run check
      - name: Verify agent skill mirrors
        run: cmp .agents/skills/design-project/SKILL.md .claude/skills/design-project/SKILL.md
      - name: Build release artifacts
        run: bun run build:release
      - name: Verify checksum and isolated installation
        run: |
          (cd release && sha256sum --check SHA256SUMS)
          version=$(bun -e 'process.stdout.write(require("./package.json").version)')
          bun run smoke:release "release/tolong-design-${version}.tgz"
      - name: Publish only the verified private artifacts
        run: |
          version=$(bun -e 'process.stdout.write(require("./package.json").version)')
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release/existing-draft.txt 2>/dev/null; then
            test "$(cat release/existing-draft.txt)" = true || { printf 'Refusing to overwrite a published release\n' >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "TolongDesign ${RELEASE_TAG}" \
              --notes "Private TolongLabs CLI release. Requires Bun 1.4+. Verify SHA256SUMS before installing the local tarball, then run tolongdesign doctor --json. Full source docs and mirrored design-project instructions are included. This tool does not guarantee design quality or replace current API/licence checks."
          fi
          gh release upload "$RELEASE_TAG" \
            "release/tolong-design-${version}.tgz" release/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false
