name: Verify

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun test
      - name: Validate documentation
        run: bun run check
      - name: Verify agent skill mirrors
        run: cmp .agents/skills/design-project/SKILL.md .claude/skills/design-project/SKILL.md
      - name: Build private release package
        run: bun run build:release
      - name: Verify a clean release installation
        run: |
          version=$(bun -e 'process.stdout.write(require("./package.json").version)')
          bun run smoke:release "release/tolong-design-${version}.tgz"
