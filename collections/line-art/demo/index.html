<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Line Art · TolongLabs</title>
    <style>
      :root {
        --page: #ebe7df;
        --text: #2a2620;
        --muted: #6f685d;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--page);
        color: var(--text);
        font: 14px/1.5 ui-serif, Georgia, serif;
      }
      main {
        width: min(96vw, 1100px);
        margin: 32px auto;
        padding: 0 16px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
      }
      .card {
        aspect-ratio: 960 / 420;
        border-radius: 14px;
        overflow: hidden;
        touch-action: none;
        box-shadow:
          0 0 0 1px rgba(40, 34, 26, 0.1),
          0 18px 50px -18px rgba(40, 34, 26, 0.35);
      }
      .card svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        margin-top: 14px;
        color: var(--muted);
      }
      .controls input[type='range'] {
        width: min(320px, 60vw);
      }
      button {
        font: inherit;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid rgba(40, 34, 26, 0.25);
        background: #fbf8f2;
        color: var(--text);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Line art</h1>
      <p>Click people to wave, the dog to make it wag, windows to switch lights. Move the pointer for wind.</p>
      <div class="card" id="card"></div>
      <div class="controls">
        <label>Time <input id="time" type="range" min="0" max="1" step="0.001" /></label>
        <label><input id="boil" type="checkbox" checked /> Line boil</label>
        <button id="export">Download SVG frame</button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
